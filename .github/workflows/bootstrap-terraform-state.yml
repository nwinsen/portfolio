name: Bootstrap Terraform State

on:
  workflow_dispatch:
    inputs:
      state_bucket_name:
        description: "Optional globally unique S3 bucket name"
        required: false
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Bootstrap state bucket
        env:
          REQUESTED_BUCKET_NAME: ${{ inputs.state_bucket_name }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_BUCKET_NAME}" ]]; then
            bucket_name="${REQUESTED_BUCKET_NAME}"
          else
            account_id="$(aws sts get-caller-identity --query Account --output text)"
            bucket_name="winsen-terraform-state-${account_id}"
          fi

          terraform -chdir=infra/bootstrap init -input=false
          terraform -chdir=infra/bootstrap apply \
            -auto-approve \
            -input=false \
            -var="state_bucket_name=${bucket_name}"

          echo ""
          echo "Add this GitHub production environment secret:"
          echo "TF_STATE_BUCKET=${bucket_name}"
