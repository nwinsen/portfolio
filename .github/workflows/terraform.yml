name: Terraform

on:
  pull_request:
    paths:
      - 'infra/**/*.tf'
      - 'infra/**/*.hcl'
      - 'infra/README.md'
      - '.github/workflows/terraform.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/**/*.tf'
      - 'infra/**/*.hcl'
      - 'infra/README.md'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the reviewed Terraform plan
        required: true
        default: false
        type: boolean

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Read live API Gateway target
        run: |
          zone_id="$(aws route53 list-hosted-zones-by-name \
            --dns-name winsen.dev. \
            --query 'HostedZones[?Name==`winsen.dev.` && Config.PrivateZone==`false`].Id | [0]' \
            --output text | sed 's#^/hostedzone/##')"
          target="$(aws route53 list-resource-record-sets \
            --hosted-zone-id "$zone_id" \
            --query 'ResourceRecordSets[?Name==`api.winsen.dev.` && Type==`A`].AliasTarget.DNSName | [0]' \
            --output text)"
          site_target="$(aws route53 list-resource-record-sets \
            --hosted-zone-id "$zone_id" \
            --query 'ResourceRecordSets[?Name==`winsen.dev.` && Type==`A`].AliasTarget.DNSName | [0]' \
            --output text)"
          test -n "$target" && test "$target" != "None"
          test -n "$site_target" && test "$site_target" != "None"
          echo "TF_VAR_api_gateway_target_domain_name=$target" >> "$GITHUB_ENV"
          echo "TF_VAR_cloudfront_domain_name=$site_target" >> "$GITHUB_ENV"

      - name: Terraform format check
        run: terraform fmt -check -recursive infra

      - name: Initialize frontend state
        run: >-
          terraform -chdir=infra/frontend init -reconfigure -input=false
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=portfolio/frontend.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Initialize backend state
        run: >-
          terraform -chdir=infra/backend init -reconfigure -input=false
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=portfolio/backend.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Validate frontend
        run: terraform -chdir=infra/frontend validate

      - name: Validate backend
        run: terraform -chdir=infra/backend validate

      - name: Plan frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform -chdir=infra/frontend plan -no-color -out=tfplan

      - name: Plan backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform -chdir=infra/backend plan -no-color -out=tfplan

      - name: Upload reviewed plans
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plans-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: |
            infra/frontend/tfplan
            infra/backend/tfplan

  apply:
    name: Terraform apply
    if: github.event_name == 'workflow_dispatch' && inputs.apply == true
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Read live API Gateway target
        run: |
          zone_id="$(aws route53 list-hosted-zones-by-name \
            --dns-name winsen.dev. \
            --query 'HostedZones[?Name==`winsen.dev.` && Config.PrivateZone==`false`].Id | [0]' \
            --output text | sed 's#^/hostedzone/##')"
          target="$(aws route53 list-resource-record-sets \
            --hosted-zone-id "$zone_id" \
            --query 'ResourceRecordSets[?Name==`api.winsen.dev.` && Type==`A`].AliasTarget.DNSName | [0]' \
            --output text)"
          site_target="$(aws route53 list-resource-record-sets \
            --hosted-zone-id "$zone_id" \
            --query 'ResourceRecordSets[?Name==`winsen.dev.` && Type==`A`].AliasTarget.DNSName | [0]' \
            --output text)"
          test -n "$target" && test "$target" != "None"
          test -n "$site_target" && test "$site_target" != "None"
          echo "TF_VAR_api_gateway_target_domain_name=$target" >> "$GITHUB_ENV"
          echo "TF_VAR_cloudfront_domain_name=$site_target" >> "$GITHUB_ENV"

      - name: Initialize frontend state
        run: >-
          terraform -chdir=infra/frontend init -reconfigure -input=false
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=portfolio/frontend.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Initialize backend state
        run: >-
          terraform -chdir=infra/backend init -reconfigure -input=false
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=portfolio/backend.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Download reviewed plans
        uses: actions/download-artifact@v4
        with:
          name: terraform-plans-${{ github.run_id }}
          path: infra

      - name: Apply frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform -chdir=infra/frontend apply -input=false tfplan

      - name: Apply backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform -chdir=infra/backend apply -input=false tfplan
